appId: com.google.android.contacts
name: Add a new contact (Android)
tags:
  - android
  - contacts
---
# Launch with a clean slate
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Open the create-contact form
- tapOn:
    id: "com.google.android.contacts:id/floating_action_button"
- waitForAnimationToEnd

# Fill in the name
- tapOn:
    text: "First name"
- inputText: Alice

- hideKeyboard
- tapOn:
    text: "Last name"
- inputText: Tester

# Fill in the phone number
# Contacts ships two editors and the image decides which one you get: the older
# build labels the row "Phone", the newer one "Phone (Mobile)" with a separate
# "+1" prefix and an "Add phone" row. `text` is a whole-value regex, so one
# alternation covers every build.
- hideKeyboard:
    strategy: "back"
- tapOn:
    text: "Phone.*|Add phone"
- inputText:
    text: "5550100"
    keyPress: true

# Save the contact
- hideKeyboard:
    strategy: "back"
- tapOn:
    text: "Save"
- waitForAnimationToEnd

# Verify the contact now appears in the list
# The list can come back with a one-time "Some menu items have moved" nag over
# it. Dismiss it when it shows; it is not on every run, so the tap is optional.
- tapOn:
    id: "android:id/closeButton"
    optional: true
- assertVisible: "Alice Tester"
