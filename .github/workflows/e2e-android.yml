name: E2E Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      py-lib: ${{ steps.filter.outputs.py-lib }}
      ts-lib: ${{ steps.filter.outputs.ts-lib }}
      py-e2e: ${{ steps.filter.outputs.py-e2e }}
      ts-e2e: ${{ steps.filter.outputs.ts-e2e }}
      android-app: ${{ steps.filter.outputs.android-app }}
      driver-apk: ${{ steps.filter.outputs.driver-apk }}
      android-yaml: ${{ steps.filter.outputs.android-yaml }}
      workflow: ${{ steps.filter.outputs.workflow }}
      docs: ${{ steps.filter.outputs.docs }}
      app: ${{ steps.filter.outputs.android-app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            py-lib:
              - 'client/python/maestro_runner/**'
            ts-lib:
              - 'client/typescript/src/**'
            py-e2e:
              - 'client/python/tests/**'
            ts-e2e:
              - 'client/typescript/tests/**'
            android-app:
              - 'e2e/android-animation-app/**'
            driver-apk:
              - 'drivers/android/**'
            android-yaml:
              - 'e2e/workspaces/**'
            workflow:
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'docs/**'

  build-and-push-apk:
    name: Build and push animation test APK
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.app == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Make gradlew executable
        run: chmod +x e2e/android-animation-app/gradlew

      - name: Build animation test APK
        run: cd e2e/android-animation-app && ./gradlew :app:assembleDebug --no-daemon

      - name: Commit and push if APK changed
        run: |
          BUILT="e2e/android-animation-app/app/build/outputs/apk/debug/app-debug.apk"
          COMMITTED="drivers/android/animation-test-app-debug.apk"

          if cmp -s "$BUILT" "$COMMITTED"; then
            echo "APK unchanged, skipping push"
            exit 0
          fi

          cp "$BUILT" "$COMMITTED"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$COMMITTED"
          git commit -m "build(anim-app): auto-rebuild animation test APK"
          git push

  e2e-android:
    name: E2E Android (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.py-lib == 'true' || needs.detect-changes.outputs.ts-lib == 'true' || needs.detect-changes.outputs.py-e2e == 'true' || needs.detect-changes.outputs.ts-e2e == 'true' || needs.detect-changes.outputs.android-app == 'true' || needs.detect-changes.outputs.driver-apk == 'true' || needs.detect-changes.outputs.android-yaml == 'true' || needs.detect-changes.outputs.workflow == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        driver: [uiautomator2, devicelab]
    env:
      MAESTRO_DRIVER: ${{ matrix.driver }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Required to run Android emulator with hardware acceleration on Linux
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/typescript/package-lock.json

      - name: Build maestro-runner
        run: |
          go mod download
          go build -o maestro-runner .

      - name: Install Python client dependencies
        working-directory: client/python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Install TypeScript client dependencies
        working-directory: client/typescript
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Write e2e test script
        run: |
          cat > /tmp/run-e2e.sh << 'SCRIPT'
          #!/usr/bin/env bash
          set +e
          FAILED=0
          mkdir -p reports/yaml reports/python reports/typescript ctrf

          # Detect emulator serial
          DEVICE=$(adb devices | grep -E "emulator-[0-9]+" | head -1 | awk '{print $1}')
          export MAESTRO_DEVICE_ID="$DEVICE"
          echo "Using device: $DEVICE"
          adb devices

          # Install UIAutomator2 server + settings (uiautomator2 driver)
          if [ "${MAESTRO_DRIVER:-uiautomator2}" = "uiautomator2" ]; then
            adb install -r -g drivers/android/appium-uiautomator2-server-v9.11.1.apk
            adb install -r -g drivers/android/appium-uiautomator2-server-debug-androidTest.apk
            adb install -r -g drivers/android/settings_apk-debug.apk
          fi
          # Animation test app (needed by all Android drivers)
          adb install -r -g drivers/android/animation-test-app-debug.apk

          # Install DeviceLab driver APKs (devicelab driver)
          if [ "${MAESTRO_DRIVER:-uiautomator2}" = "devicelab" ]; then
            adb install -r -g drivers/android/devicelab-android-driver.apk
            adb install -r -g drivers/android/devicelab-android-driver-test.apk
          fi

          # --- YAML flow tests ---
          echo "::group::YAML flow tests"
          ./maestro-runner --platform android test --output reports/yaml e2e/workspaces/contacts/add_contact_android.yaml || FAILED=1
          echo "::endgroup::"

          # --- Python e2e tests (conftest.py auto-starts server) ---
          echo "::group::Python e2e tests"
          cd client/python
          .venv/bin/python -m pytest tests/test_add_contact.py tests/test_wait_for_animation_to_end.py tests/test_wait_for_animation_never_ends.py -v --junit-xml=../../reports/python/junit.xml || FAILED=1
          cd ../..
          echo "::endgroup::"

          # --- TypeScript e2e tests (setup.ts auto-starts server) ---
          echo "::group::TypeScript e2e tests"
          cd client/typescript
          JEST_JUNIT_OUTPUT_DIR=../../reports/typescript JEST_JUNIT_OUTPUT_NAME=junit.xml npx jest tests/test_add_contact.device.test.ts tests/test_wait_for_animation_never_ends.device.test.ts --runInBand --reporters=default --reporters=jest-junit || FAILED=1
          cd ../..
          echo "::endgroup::"

          exit $FAILED
          SCRIPT
          chmod +x /tmp/run-e2e.sh

      - name: Run Android E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-boot-anim -no-snapshot-load -netdelay none -netspeed full -no-window -gpu swiftshader_indirect
          disable-animations: true
          script: bash /tmp/run-e2e.sh

      - name: Generate CTRF reports
        if: always()
        run: |
          mkdir -p ctrf

          # Convert YAML flow JUnit XMLs (one timestamped subdir per run)
          find reports/yaml -name "*.xml" -type f | while read -r f; do
            name=$(basename "$(dirname "$f")")
            npx --yes junit-to-ctrf "$f" -o "ctrf/yaml-${name}-ctrf.json" || true
          done

          # Convert Python e2e JUnit
          if [ -f reports/python/junit.xml ]; then
            npx --yes junit-to-ctrf reports/python/junit.xml -o ctrf/python-ctrf.json || true
          fi

          # Convert TypeScript e2e JUnit
          if [ -f reports/typescript/junit.xml ]; then
            npx --yes junit-to-ctrf reports/typescript/junit.xml -o ctrf/ts-ctrf.json || true
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-reports-${{ github.run_number }}
          path: |
            reports/
            ctrf/
          retention-days: 14

      - name: Publish test results
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: 'ctrf/*.json'
          pull-request-report: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
