name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be re-fired without an empty commit — during the 2026-08-06
  # Actions outage a push produced no run at all and there was nothing to retry.
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      py-lib: ${{ steps.filter.outputs.py-lib }}
      ts-lib: ${{ steps.filter.outputs.ts-lib }}
      workflow: ${{ steps.filter.outputs.workflow }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            py-lib:
              - 'client/python/maestro_runner/**'
            ts-lib:
              - 'client/typescript/src/**'
            workflow:
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'docs/**'

  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.workflow == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned deliberately. `latest` resolves at run time, so the same
          # commit can pass today and fail tomorrow. v1.64.8 was built with
          # go1.24 and refuses to load a module whose go.mod pins toolchain
          # go1.26.7; v2 releases are built with a new enough Go. The rules are
          # kept at v1's baseline in .golangci.yml.
          version: v2.13.2

  test-go:
    name: Test Go (shard ${{ matrix.shard.id }})
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.workflow == 'true' }}
    env:
      CDP_PARALLEL: "4"
    strategy:
      fail-fast: false
      # Static sharding: no prepare step, no timing run. The slow CDP browser
      # package runs alone in its own shard (parallelized via t.Parallel()).
      # The remaining fast packages are split round-robin across the other 3
      # shards. Keep node_modules (e.g. the TS client's flatted dep) out of the
      # lists — they are not repo tests. If packages are added/renamed, update
      # the lists below.
      matrix:
        shard:
          - id: cdp
            packages: "github.com/devicelab-dev/maestro-runner/pkg/driver/browser/cdp"
          - id: s1
            packages: "github.com/devicelab-dev/maestro-runner/pkg/cli github.com/devicelab-dev/maestro-runner/pkg/core github.com/devicelab-dev/maestro-runner/pkg/driver/devicelab github.com/devicelab-dev/maestro-runner/pkg/driver/uiautomator2 github.com/devicelab-dev/maestro-runner/pkg/executor github.com/devicelab-dev/maestro-runner/pkg/jsengine github.com/devicelab-dev/maestro-runner/pkg/report github.com/devicelab-dev/maestro-runner/pkg/uiautomator2"
          - id: s2
            packages: "github.com/devicelab-dev/maestro-runner github.com/devicelab-dev/maestro-runner/pkg/cloud github.com/devicelab-dev/maestro-runner/pkg/device github.com/devicelab-dev/maestro-runner/pkg/driver/devicelab_ios github.com/devicelab-dev/maestro-runner/pkg/driver/wda github.com/devicelab-dev/maestro-runner/pkg/flow github.com/devicelab-dev/maestro-runner/pkg/logger github.com/devicelab-dev/maestro-runner/pkg/server github.com/devicelab-dev/maestro-runner/pkg/validator"
          - id: s3
            packages: "github.com/devicelab-dev/maestro-runner/drivers github.com/devicelab-dev/maestro-runner/pkg/config github.com/devicelab-dev/maestro-runner/pkg/driver/appium github.com/devicelab-dev/maestro-runner/pkg/driver/mock github.com/devicelab-dev/maestro-runner/pkg/emulator github.com/devicelab-dev/maestro-runner/pkg/flutter github.com/devicelab-dev/maestro-runner/pkg/maestro github.com/devicelab-dev/maestro-runner/pkg/simulator"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (shard ${{ matrix.shard.id }})
        env:
          # The CDP browser shard is slow under -race; drop it there (the fast
          # shards keep -race). Set via expression so the flag is empty for cdp.
          RACE_FLAG: ${{ matrix.shard.id != 'cdp' && '-race' || '' }}
        run: |
          PKGS="${{ matrix.shard.packages }}"
          echo "Testing shard ${{ matrix.shard.id }} (race='$RACE_FLAG'):"
          echo "$PKGS"
          # shellcheck disable=SC2086
          go test $RACE_FLAG -parallel "$CDP_PARALLEL" -v -coverprofile=coverage-${{ matrix.shard.id }}.out -covermode=atomic $PKGS

      - name: Upload coverage
        if: ${{ hashFiles(format('coverage-{0}.out', matrix.shard.id)) != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-${{ matrix.shard.id }}.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-python:
    name: Test Python Client
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.py-lib == 'true' || needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.workflow == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: client/python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run unit tests
        working-directory: client/python
        # --noconftest skips conftest.py so the autouse _track_client fixture
        # (which requires a real maestro-runner server + device) is not loaded.
        # Unit tests use their own requests_mock fixtures and need no server.
        run: .venv/bin/python -m pytest tests/test_client.py tests/test_models.py -v --noconftest

      - name: Lint
        working-directory: client/python
        run: .venv/bin/ruff check maestro_runner tests

      - name: Type check
        working-directory: client/python
        run: .venv/bin/mypy maestro_runner

  test-typescript:
    name: Test TypeScript Client
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.ts-lib == 'true' || needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.workflow == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/typescript/package-lock.json

      - name: Install dependencies
        working-directory: client/typescript
        run: npm ci

      - name: Run unit tests
        working-directory: client/typescript
        run: npm run test:unit

      - name: Lint
        working-directory: client/typescript
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-go, test-go, test-python, test-typescript, detect-changes]
    if: ${{ needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.workflow == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
