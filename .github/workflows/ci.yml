name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prepare:
    name: Prepare test shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Collect package timings and build balanced shard matrix
        id: shards
        env:
          SHARD_COUNT: "4"
        run: |
          set -euo pipefail
          # Run the suite once (no -race) purely to measure per-package time.
          go test -json -count=1 ./... > /tmp/timing.json 2>/dev/null || true
          MATRIX=$(python3 - <<'PY'
          import json, os, sys
          n = int(os.environ.get("SHARD_COUNT", "4"))
          dur = {}
          try:
              with open("/tmp/timing.json") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          e = json.loads(line)
                      except Exception:
                          continue
                      if e.get("Action") in ("pass", "fail") and "Package" in e and "Elapsed" in e:
                          p = e["Package"]
                          dur[p] = max(dur.get(p, 0.0), float(e["Elapsed"]))
          except FileNotFoundError:
              pass
          # Fallback if timing collection failed: spread packages round-robin.
          if not dur:
              pkgs = sorted(p.strip() for p in os.popen("go list ./...").read().split() if p.strip())
              dur = {p: 1.0 for p in pkgs}
          # Greedy bin-packing: assign each (slowest-first) package to the
          # currently least-loaded shard so total time is balanced, not count.
          pkgs = sorted(dur.items(), key=lambda x: -x[1])
          shards = [[] for _ in range(n)]
          totals = [0.0] * n
          for p, d in pkgs:
              i = min(range(n), key=lambda k: totals[k])
              shards[i].append(p)
              totals[i] += d
          # Diagnostics (stderr so it doesn't pollute the JSON on stdout).
          print("Per-package durations (slowest first):", file=sys.stderr)
          for p, d in pkgs:
              print(f"  {d:8.2f}s  {p}", file=sys.stderr)
          print("Balanced shard estimates:", file=sys.stderr)
          for i in range(n):
              print(f"  shard {i}: est {totals[i]:.2f}s across {len(shards[i])} pkgs", file=sys.stderr)
          print(json.dumps([{"shard": i, "packages": " ".join(shards[i])} for i in range(n)]))
          PY
          )
          echo "Computed shard matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: true

      - name: Install golangci-lint v2.11.3
        run: |
          mkdir -p $HOME/bin
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $HOME/bin v2.11.3
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Lint
        run: golangci-lint run ./... --output.json.path=/tmp/lint-report.json && echo "Lint passed"

  test-go:
    name: Test Go (shard ${{ matrix.shard.shard }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (shard ${{ matrix.shard.shard }})
        run: |
          PKGS="${{ matrix.shard.packages }}"
          if [ -z "$PKGS" ]; then
            echo "No packages assigned to this shard; skipping."
            exit 0
          fi
          echo "Testing shard ${{ matrix.shard.shard }}:"
          echo "$PKGS"
          # shellcheck disable=SC2086
          go test -race -coverprofile=coverage-${{ matrix.shard.shard }}.out -covermode=atomic $PKGS

      - name: Upload coverage
        if: ${{ hashFiles(format('coverage-{0}.out', matrix.shard.shard)) != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-${{ matrix.shard.shard }}.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-python:
    name: Test Python Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: client/python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run unit tests
        working-directory: client/python
        # --noconftest skips conftest.py so the autouse _track_client fixture
        # (which requires a real maestro-runner server + device) is not loaded.
        # Unit tests use their own requests_mock fixtures and need no server.
        run: .venv/bin/python -m pytest tests/test_client.py tests/test_models.py -v --noconftest

      - name: Lint
        working-directory: client/python
        run: .venv/bin/ruff check maestro_runner tests

      - name: Type check
        working-directory: client/python
        run: .venv/bin/mypy maestro_runner

  test-typescript:
    name: Test TypeScript Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/typescript/package-lock.json

      - name: Install dependencies
        working-directory: client/typescript
        run: npm ci

      - name: Run unit tests
        working-directory: client/typescript
        run: npm run test:unit

      - name: Lint
        working-directory: client/typescript
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-go, test-python, test-typescript]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: true

      - name: Build
        run: go build -v ./...
